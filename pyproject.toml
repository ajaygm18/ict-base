[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-trading-system"
version = "1.0.0"
description = "Production-ready ICT Trading Automation System"
authors = [{name = "ICT Trading Team", email = "team@icttrading.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "talib>=0.4.0",
    "pandas-ta>=0.3.14b0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "redis>=4.5.0",
    "structlog>=23.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "asyncpg>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
]
prod = [
    "gunicorn>=20.1.0",
    "prometheus-client>=0.16.0",
    "sentry-sdk>=1.25.0",
]

[project.urls]
Homepage = "https://github.com/ajaygm18/ict-base"
Repository = "https://github.com/ajaygm18/ict-base"
Issues = "https://github.com/ajaygm18/ict-base/issues"

[tool.setuptools]
packages = ["ai", "ict_engine", "models", "risk_engine", "data_pipeline", "trading_engine", "backtesting", "monitoring"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=ai --cov=ict_engine --cov=models --cov=risk_engine --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"